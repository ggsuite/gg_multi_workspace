name: gg_multi_workspace
description: "Workspace management of the gg_multi tool family - adding repos and organizations, importing, creating and removing tickets, syncing the ocean, listing workspaces."
version: 4.21.0
repository: https://github.com/ggsuite/gg_multi_workspace.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_console_colors: ^2.5.0
  gg_git: ^4.7.0
  gg_local_package_dependencies: ^4.2.3
  gg_localize_refs: ^5.2.0
  gg_log: ^1.2.0
  gg_create_repo: ^0.0.4
  gg_multi_core: ^4.15.0
  gg_one: ^14.4.12
  gg_process: ^1.4.0
  gg_status_printer: ^1.6.3
  helix: ^1.14.0
  http: ^1.6.0
  path: ^1.9.1
  pubspec_parse: ^1.7.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  dna_ggsuite: ^1.0.0
  gg_capture_print: ^1.2.1
  gg_lang: ^0.8.3
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.33.0