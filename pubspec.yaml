name: gg_multi_workspace
description: "Workspace management of the gg_multi tool family - adding repos and organizations, importing, creating and removing tickets, syncing the ocean, listing workspaces."
version: 3.0.0
repository: https://github.com/ggsuite/gg_multi_workspace.git

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.0
  gg_console_colors: ^2.3.0
  gg_git: ^4.1.1
  gg_local_package_dependencies: ^3.0.0
  gg_localize_refs: ^4.2.3
  gg_log: ^1.0.6
  gg_multi_core: ^3.0.1
  gg_one: ^14.1.3
  gg_status_printer: ^1.4.2
  http: ^1.6.0
  interact: ^2.2.0
  path: ^1.9.1
  pubspec_parse: ^1.5.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  gg_capture_print: ^1.0.9
  gg_lang: ^0.5.0
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.31.2